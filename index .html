<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <title>Eggplant Clicker</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <div class="game-container">
        <h1>Určitě ne Cookie Clicker</h1>
        <h2>Získat LILEK: <span id="skore">0</span></h2>
        <h3>Pasivní příjem: <span id="pasivni-prijem-text">0</span>×<span id="pasivni-prijem-text-mult">1</span>lilků/s</h3>
        <h3>Síla kliknutí: <span id="klik-text">1</span>×<span id="klik-text-mult">1</span> lilků/klik</h3>

        <button id="btn-lilek" class="btn-main">🍆 Sklidit lilek</button>

        <hr>

        <h3>Obchod s budovami</h3>
        <div class="shop">
            <button id="btn-farmar" class="btn-shop">🧑🏿‍🌾 Najmout Farmáře (Cena: 10 lilků)</button>
            <button id="btn-zahrada" class="btn-shop">🌲 Koupit Zahradu (Cena: 50 lilků)</button>
            <button id="btn-plantaz" class="btn-shop">🏞️ Koupit Plantáž (Cena: 1000 lilků)</button> 
            <button id="btn-sklenik" class="btn-shop">🏢 Koupit Skleník (Cena: 5000 lilků)</button> 
            <button id="btn-laborator" class="btn-shop">🧬 Genetická laboratoř (Cena: 50000 lilků)</button> 
            <button id="btn-monopol" class="btn-shop">🏢 Lilek Barák (Cena: 500000 lilků)</button> 
        </div>

        <hr>

        <h3>Technologie a vylepšení</h3>
        <div class="shop">
            <button id="btn-zalivani" class="btn-shop">💦 Koupit Zalévání (Cena: 10000 lilků, dává +20% k síle kliku)</button> 
            <button id="btn-motyky" class="btn-shop">⛏️ Ostré motyky (Cena: 250 lilků, +2 k síle kliku)</button> 
            <button id="btn-hnojivo" class="btn-shop">🧪 Prémiové hnojivo (Cena: 2500 lilků, zvýší pasivní příjem o 15 %)</button> 
        </div>
        
        <hr>
        <button id="btn-reset" style="background-color: #ff4d4d; color: white; padding: 10px; border: none; border-radius: 5px; cursor: pointer; margin-top: 15px;">🔄 Resetovat hru</button>
    </div>

</body>
</html>

</body>
</html>
