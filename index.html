<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <title>Crypto Net Clicker</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <div class="game-container">
        <h1>Crypto Net Clicker</h1>
        <h2>Těžená DATA: <span id="skore">0</span></h2>
        <h3>Pasivní příjem: <span id="pasivni-prijem-text">0</span>×<span id="pasivni-prijem-text-mult">1</span> Data/s</h3>
        <h3>Síla kliknutí: <span id="klik-text">1</span>×<span id="klik-text-mult">1</span> Data/klik</h3>

        <button id="btn-lilek" class="btn-main">⚡ Těžit data</button>

        <hr>

        <h3>Obchod s budovami</h3>
        <div class="shop">
            <button id="btn-farmar" class="btn-shop">🤖 Spustit Basic Botnet (Cena: 10 Data)</button>
            <button id="btn-zahrada" class="btn-shop">💻 Koupit Těžební Rig (Cena: 50 Data)</button>
            <button id="btn-plantaz" class="btn-shop">🖥️ Pronajmout Cloud Server (Cena: 1000 Data)</button> 
            <button id="btn-sklenik" class="btn-shop">🏢 Postavit Datacentrum (Cena: 5000 Data)</button> 
            <button id="btn-laborator" class="btn-shop">🧠 Síť Umělé Inteligence (Cena: 50000 Data)</button> 
            <button id="btn-monopol" class="btn-shop">🌌 Kvantový Monopol (Cena: 500000 Data)</button> 
        </div>

        <hr>

        <h3>Technologie a vylepšení</h3>
        <div class="shop">
            <button id="btn-zalivani" class="btn-shop">⚡ Přetaktování CPU (Cena: 10000 Data, +20% ke kliku)</button> 
            <button id="btn-motyky" class="btn-shop">🔌 Nová Grafická Karta (Cena: 250 Data, +2 ke kliku)</button> 
            <button id="btn-hnojivo" class="btn-shop">❄️ Vodní Chlazení (Cena: 2500 Data, +15% k pasivnímu příjmu)</button> 
        </div>
        
        <hr>
        <button id="btn-reset" class="btn-shop btn-reset-style">🔄 Resetovat hru</button>
    </div>

</body>
</html>
